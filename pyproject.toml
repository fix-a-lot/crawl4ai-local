[project]
name = "crawl4ai-local"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fix-a-lot", email = "35915923+fix-a-lot@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "crawl4ai>=0.9.4",
    "mcp[cli]>=2.2.0",
]

[project.scripts]
main = "crawl4ai_local.server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anti-slop-py>=0.1.1",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
extend-select = [
    "ANN401", # bans `Any` in parameters and returns
    "PGH003", # bans blanket `# type: ignore`
    "B009",   # bans getattr with a constant name
    "B010",   # bans setattr with a constant name
    "TID251", # banned APIs, listed below
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock.patch".msg = "Module mocking hides real seams; inject the dependency instead (anti-slop no-module-mocking)."

[tool.mypy]
files = ["src", "tests"]
disallow_any_explicit = true
disallow_any_generics = true
disallow_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["crawl4ai", "crawl4ai.*"]
follow_untyped_imports = true
